openapi: 3.0.0
info:
  title: Verifications API
  version: 1.0.0
  description: |
    Order payroll, banking, and document-based income verifications.
security:
  - basicAuth: []
paths:
  /v2/sessions:
    post:
      summary: Create a session
      description: >-
        Create a connection session and return a `link` URL that launches the
        frontend experience.


        Session links expire after one hour. A new session link can be created
        at any time by creating another session for the active verification.


        <Note>This endpoint is for payroll and banking verifications
        only.</Note>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientSessionCreateRequest'
            examples:
              payroll:
                summary: Example Request (Payroll)
                value:
                  verification: 43a2c6c3-1e63-91e5-88e3-f9ab2dcc489b
                  configuration:
                    redirect_url: https://your-application.com/return
                    flow_id: 12ABCD3E
                    items:
                      - item_000000001
                      - item_000000002
                    language: EN
                    mobile_app: true
              banking:
                summary: Example Request (Banking)
                value:
                  verification: 43a2c6c3-1e63-91e5-88e3-f9ab2dcc489b
                  configuration:
                    experience: 97f1eccb-241d-4052-8409-fab9e27a589b
                    single_use_url: false
                    redirect_url: https://your-application.com/return
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSession'
              examples:
                payroll:
                  summary: Example Response (Payroll)
                  value:
                    verification: 43a2c6c3-1e63-91e5-88e3-f9ab2dcc489b
                    configuration:
                      experience: null
                      single_use_url: false
                      redirect_url: https://your-application.com/return
                      flow_id: 12ABCD3E
                      items:
                        - item_000000001
                        - item_000000002
                      language: EN
                      mobile_app: true
                    link: https://connect.argyle.com/?...
                    data_source: payroll
                banking:
                  summary: Example Response (Banking)
                  value:
                    verification: 43a2c6c3-1e63-91e5-88e3-f9ab2dcc489b
                    configuration:
                      experience: 97f1eccb-241d-4052-8409-fab9e27a589b
                      single_use_url: false
                      redirect_url: https://your-application.com/return
                    link: https://connect2.finicity.com?...
                    data_source: banking
  /v2/verifications:
    post:
      summary: Order a verification
      description: >-
        Orders a new verification.


        <Note>

        [Create a user](/api-reference/verifications-guide#create-a-user) or
        update an existing user with the required details before ordering
        payroll, banking, or document verifications.

        </Note>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientVerificationCreateRequest'
            examples:
              payroll:
                summary: Example Request (Payroll)
                value:
                  user: 018051aa-f7a9-a0db-2f38-6cfa325e9d69
                  report:
                    type: voie
                  loan: &ref_0
                    number: '1234'
                    borrower_id: ABC789
                    application_id: '2121313'
                    officer_email: john.doe@mortgage.com
                  billing: &ref_1
                    cost_center: '5'
              banking:
                summary: Example Request (Banking)
                value:
                  user: 018051aa-f7a9-a0db-2f38-6cfa325e9d69
                  report:
                    type: voai
                    configuration:
                      from_date: '2024-01-01T00:00:00Z'
                      income_stream_confidence_minimum: 50
                      report_custom_fields:
                        - label: loanID
                          value: '12345'
                          shown: true
                  loan: *ref_0
                  billing: *ref_1
              documents:
                summary: Example Request (Documents)
                value:
                  user: 018051aa-f7a9-a0db-2f38-6cfa325e9d69
                  employments:
                    - employer: Warehouse Services Inc
                      status: active
                      hire_date: '2023-02-01'
                      termination_date: null
                  report:
                    type: doc-voi-mortgage
                  loan: *ref_0
                  billing: *ref_1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientVerification'
              examples:
                payroll:
                  summary: Example Response (Payroll)
                  value:
                    id: 43a2c6c3-1e63-91e5-88e3-f9ab2dcc489b
                    user: 018051aa-f7a9-a0db-2f38-6cfa325e9d69
                    created_at: '2023-03-09T16:22:06.081Z'
                    updated_at: '2023-03-09T16:22:06.081Z'
                    channel: api
                    status:
                      state: PENDING
                      code: pending
                      errors: []
                    report:
                      id: null
                      type: voie
                      file_url: null
                      json_url: null
                    employments: []
                    loan: *ref_0
                    billing: *ref_1
                    data_source: payroll
                banking:
                  summary: Example Response (Banking)
                  value:
                    id: 43a2c6c3-1e63-91e5-88e3-f9ab2dcc489b
                    user: 018051aa-f7a9-a0db-2f38-6cfa325e9d69
                    created_at: '2023-03-09T16:22:06.081Z'
                    updated_at: '2023-03-09T16:22:06.081Z'
                    channel: api
                    status:
                      state: PENDING
                      code: pending
                      errors: []
                    report:
                      id: null
                      type: voai
                      file_url: null
                      json_url: null
                      configuration:
                        from_date: '2024-01-01T00:00:00Z'
                        income_stream_confidence_minimum: 50
                        report_custom_fields:
                          - label: loanID
                            value: '12345'
                            shown: true
                    employments: []
                    loan: *ref_0
                    billing: *ref_1
                    data_source: banking
                documents:
                  summary: Example Response (Documents)
                  value:
                    id: 43a2c6c3-1e63-91e5-88e3-f9ab2dcc489b
                    user: 018051aa-f7a9-a0db-2f38-6cfa325e9d69
                    created_at: '2023-03-09T16:22:06.081Z'
                    updated_at: '2023-03-09T16:22:06.081Z'
                    channel: api
                    status:
                      state: PENDING
                      code: pending
                      errors: []
                    report:
                      id: null
                      type: doc-voi-mortgage
                      file_url: null
                      json_url: null
                    employments:
                      - employer: Warehouse Services Inc
                        status: active
                        hire_date: '2023-02-01'
                        termination_date: null
                    loan: *ref_0
                    billing: *ref_1
                    data_source: documents
    get:
      summary: List all verifications
      description: Returns a paginated list of all verification objects.
      parameters:
        - name: user
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by user ID.
        - name: status_state
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - PROCESSING
              - PAUSED
              - CANCELLED
              - COMPLETED
          description: Filter by verification status `state`.
        - name: status_code
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - documents_processing
              - more_data_required
              - report_available
              - waiting_on_third_party
              - report_generating
              - argyle_timeout
              - cancelled_by_client
              - completed
              - completed_with_errors
              - user_session_started
              - authenticated
          description: Filter by verification status `code`.
        - name: report_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - voie
              - voe
              - voa
              - voi
              - voai
              - voe-transactions
              - doc-voi-mortgage
          description: Filter by report `type`.
        - name: loan_number
          in: query
          required: false
          schema:
            type: string
          description: Filter by loan `number`.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: >
            Number of verification objects returned [per
            page](/api-guide/overview#pagination). Default: 10. Maximum: 200.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: >-
            The URL returned in `next` or `previous` used to retrieve another
            [page](/api-guide/overview#pagination) of results.
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  next:
                    type: string
                    nullable: true
                    description: URL for the next page of results, if available.
                  previous:
                    type: string
                    nullable: true
                    description: URL for the previous page of results, if available.
                  results:
                    type: array
                    description: Array of verification objects.
                    items:
                      $ref: '#/components/schemas/ClientVerification'
              example:
                next: >-
                  https://api-sandbox.argyle.com/v2/verifications?cursor=ZXhhbXBsZV9jdXJzb3I
                previous: null
                results:
                  - id: 43a2c6c3-1e63-91e5-88e3-f9ab2dcc489b
                    user: 018051aa-f7a9-a0db-2f38-6cfa325e9d69
                    created_at: '2023-03-09T16:22:06.081Z'
                    updated_at: '2023-03-09T16:22:06.081Z'
                    channel: api
                    status:
                      state: PENDING
                      code: pending
                      errors: []
                    report:
                      id: 2a14ce6f-3aed-4c15-8ea2-92a17b6edb95
                      type: voie
                      file_url: null
                      json_url: null
                    employments: []
                    loan:
                      number: '1234'
                      borrower_id: ABC789
                      application_id: '2121313'
                      officer_email: john.doe@mortgage.com
                    billing:
                      cost_center: '5'
                    data_source: payroll
                  - id: 43a2c6c3-1e63-91e5-88e3-f9ab2dcc3333
                    user: 018051aa-f7a9-a0db-2f38-6cfa325e9345
                    created_at: '2023-03-10T05:14:06.081Z'
                    updated_at: '2023-03-10T13:03:06.081Z'
                    channel: api
                    status:
                      state: PROCESSING
