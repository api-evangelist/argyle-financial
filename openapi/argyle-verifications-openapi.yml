    ClientSessionCreateConfiguration:
      type: object
      description: Connection session configuration for payroll and banking verifications.
      properties:
        experience:
          type: string
          format: uuid
          description: Banking only. Optional bank connection experience customization ID.
        single_use_url:
          type: boolean
          description: >-
            Banking only. If `true`, the session link expires after one
            successful connection.
        redirect_url:
          type: string
          nullable: true
          description: >-
            Payroll and banking. Optional redirect URL after session completion.
            Hosted/direct-launch flows should always set this. On desktop
            browsers, use a regular `https://` URL. For mobile app flows, use a
            custom scheme such as `your-custom-scheme://return-to-app`, or a
            Universal Link on iOS / App Link on Android. Universal Links and App
            Links are the more modern approach. You can include an
            application-owned state or nonce value to match the returning
            browser session to an internal user, session, or verification.
            Argyle appends `user_submission_complete` and
            `user_attempted_employer_selection`, which mirror the
            [`onClose`](/link/reference/callbacks#onclose) fields.
        flow_id:
          type: string
          description: >-
            Payroll only. Optional payroll embedded connection experience
            customization ID.
        items:
          type: array
          description: >-
            Payroll only. Limits Link to the provided Items. If one Item is
            provided, Link skips search and opens that Item's login screen. If
            multiple Items are provided, Link shows only those Items.
          items:
            type: string
          example:
            - item_000000001
            - item_000000002
        language:
          type: string
          enum:
            - EN
            - ES
            - RU
            - ZH
          description: >-
            Payroll only. Supported Link [display
            language](/link/initialization/overview#optional-initialization-parameters).
        mobile_app:
          type: boolean
          description: >-
            Payroll only. Set to `true` when the session is used in a mobile
            app, including Hosted Link opened in a secure browser context.
    ClientSessionConfiguration:
      allOf:
        - $ref: '#/components/schemas/ClientSessionCreateConfiguration'
    ClientSessionCreateRequest:
      type: object
      properties:
        verification:
          type: string
          format: uuid
          description: ID of the verification used to initialize the session.
        configuration:
          $ref: '#/components/schemas/ClientSessionCreateConfiguration'
      required:
        - verification
    ClientSession:
      type: object
      description: Client connection session object.
      properties:
        verification:
          type: string
          format: uuid
          description: Verification ID associated with the session.
        configuration:
          $ref: '#/components/schemas/ClientSessionConfiguration'
        link:
          type: string
          description: >-
            URL used to launch the payroll or banking frontend experience. For
            payroll, use it as `connectUrl` when initializing the [Web
            SDK](/link/initialization/web#initialize-with-connecturl); the
            returned session URL already determines whether the session runs in
            Sandbox or Production. Alternatively, open it directly for [Hosted
            Link](/link/initialization/hosted-link). For banking, use it to
            launch either an Embedded banking session or a Hosted banking
            session. Session links expire after one hour. A new session link can
            be created at any time by creating another session for the active
            verification.
        data_source:
          type: string
          enum:
            - payroll
            - banking
          description: Source of connection data.
    ClientVerificationListResponse:
      type: object
      description: Paginated list of client verification objects.
      properties:
        next:
          type: string
          format: uri
          nullable: true
          description: URL for the next page of results, if available.
        previous:
          type: string
          format: uri
          nullable: true
          description: URL for the previous page of results, if available.
        results:
          type: array
          items:
            $ref: '#/components/schemas/ClientVerification'
    ClientVerification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique ID of the verification.
        user:
          type: string
          format: uuid
          description: ID of the user associated with the verification.
        created_at:
          type: string
          format: date-time
          description: >-
            Timestamp ([ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)) when
            the verification was requested.
        updated_at:
          type: string
          format: date-time
          description: >-
            Timestamp ([ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)) when
            the verification object was last updated.
        channel:
          type: string
          enum:
            - api
            - encompass
          example: api
          description: Origin of the verification order.
        status:
          $ref: '#/components/schemas/ClientVerificationStatus'
        report:
          $ref: '#/components/schemas/ClientVerificationReport'
        employments:
          type: array
          description: List of employments for the user. Documents only.
          items:
            $ref: '#/components/schemas/ClientVerificationEmployment'
        loan:
          $ref: '#/components/schemas/ClientVerificationLoan'
        billing:
          $ref: '#/components/schemas/ClientVerificationBilling'
        data_source:
          type: string
          enum:
            - payroll
            - banking
            - documents
          description: Source of verification data.
    ClientVerificationStatus:
      type: object
      description: Verification status information.
      properties:
        state:
          type: string
          enum:
            - PENDING
            - PROCESSING
            - PAUSED
            - CANCELLED
            - COMPLETED
          description: >
            Verification state.


            - `PENDING` - Initial status after verification is created.

            - `PROCESSING` - Verification processing is underway.

            - `PAUSED` - Verification is paused because more data or documents
            are required.

            - `CANCELLED` - Verification has been cancelled.

            - `COMPLETED` - Verification is complete and report assets are
            available.
        code:
          type: string
          enum:
            - pending
            - documents_processing
            - more_data_required
            - report_available
            - waiting_on_third_party
            - report_generating
            - argyle_timeout
            - cancelled_by_client
            - completed
            - completed_with_errors
            - user_session_started
            - authenticated
          description: >-
            Verification status code.


            For `doc-voi-mortgage` report types:

            - `pending` - Verification created.

            - `documents_processing` - Documents processing.

            - `more_data_required` - More data or documents are needed to
            complete the verification.

            - `report_available` - Data and documents are sufficient to complete
            verification.

            - `waiting_on_third_party` - Awaiting processing by a third party.

            - `report_generating` - Report is currently generating.

            - `argyle_timeout` - Verification request has been cancelled by
            Argyle after 180 days of inactivity.

            - `cancelled_by_client` - Verification has been cancelled.

            - `completed` - Verification request complete. Report can be
            retrieved.

            - `completed_with_errors` - Verification request completed. Report
            can be retrieved but is not GSE eligible.


            For payroll and banking report types:

            - `pending` - Verification created.

            - `user_session_started` - User opened the payroll or banking
            connection experience.

            - `authenticated` - User authenticated for payroll or banking; data
            aggregation is in progress.

            - `completed` - Report is ready for download.
        errors:
          type: array
          description: >
            Error information.


            Error details can explain what caused a `PAUSED` state or prevented
            GSE eligibility for a `COMPLETED` document verification.
          items:
            $ref: '#/components/schemas/ClientVerificationError'
    ClientVerificationError:
      type: object
      description: Verification error details.
      properties:
        code:
          type: string
          description: Error code.
        title:
          type: string
          description: Error title.
        message:
          type: string
          description: Error message.
        resources:
          type: array
          description: >-
            Additional troubleshooting resources (for example, the ID of an
            unmatched document).
          items:
            $ref: '#/components/schemas/ClientVerificationErrorResource'
      example:
        code: self-employed_income
        title: Self-employed income
        message: Self-employed income cannot be assessed using Paystub and W2 Data.
        resources:
          - id: null
            type: employments
            name: Freelance Consulting LLC
    ClientVerificationErrorResource:
      type: object
      description: Verification error resource details.
      properties:
        id:
          type: string
          nullable: true
          description: ID of the associated resource, if available.
        type:
          type: string
          description: Resource type.
        name:
          type: string
          description: Resource name.
    ClientReportCustomField:
      type: object
      description: Custom field returned in report JSON as a pass-through value.
      properties:
        label:
          type: string
          description: Custom field name.
        value:
          type: string
          description: Custom field value.
        shown:
          type: boolean
          description: Show custom field on report PDF.
    ClientVerificationReportConfiguration:
      type: object
      description: Optional banking report configurations.
      properties:
        bank_accounts:
          type: array
          items:
            type: string
          description: >-
            List of [bank account](/api-reference/bank-accounts) IDs to be
            included in the report.
        from_date:
          type: string
          format: date-time
          description: >
            Restrict report to data from on or after this datetime ([ISO
            8601](https://en.wikipedia.org/wiki/ISO_8601)).


            - `VOAI` reports - controls the length of asset history

            - `VOA` reports - controls the length of asset history

            - `VOI` reports - controls the length of income history
        income_from_date:
          type: string
          format: date-time
          description: >
            Restrict report to data from on or after this datetime ([ISO
            8601](https://en.wikipedia.org/wiki/ISO_8601)).


            - `VOAI` reports - controls the length of income history

            - Does not apply to `VOA` or `VOI` reports.
        income_stream_confidence_minimum:
          type: integer
          minimum: 0
          maximum: 100
          description: >
            Limit income streams used in the report to those above this
            confidence value (`0-100` accepted).


            Only available for `VOI` and `VOAI` report types.
        report_custom_fields:
          type: array
          maxItems: 5
          description: >-
            Include up to `5` custom objects in the report metadata. Often used
            for identifying information.
          items:
            $ref: '#/components/schemas/ClientReportCustomField'
    ClientVerificationReport:
      type: object
      description: Report information.
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: |
            Unique ID of the report.

            Only available when verification state is `COMPLETED`.
        type:
          type: string
          enum: &ref_2
            - voie
            - voe
            - voa
            - voi
            - voai
            - voe-transactions
            - doc-voi-mortgage
          description: >-
            The type of report.


            Payroll:

            - `voie` - Verification of Income and Employment.

            - `voe` - Verification of Employment.


            Banking:

            - `voa` - Banking verification of assets.

            - `voi` - Banking verification of income.

            - `voai` - Banking verification of income and assets.

            - `voe-transactions` - Banking verification of employment.


            Documents:

            - `doc-voi-mortgage` - Document-based verification of income,
            integrated with Freddie Mac's AIM Check.
        file_url:
          type: string
          nullable: true
          example: www.argyle.com/storagename/pdf
          description: >
            Download link to the report PDF.


            Requires [Argyle authentication
            headers](/api-guide/overview#authentication). Only available when
            verification state is `COMPLETED`.
        json_url:
          type: string
          nullable: true
          example: www.argyle.com/storagename/json
          description: >
            Download link to the report in JSON.


            Requires [Argyle authentication
            headers](/api-guide/overview#authentication). Only available when
            verification state is `COMPLETED`.
        configuration:
          $ref: '#/components/schemas/ClientVerificationReportConfiguration'
    ClientVerificationEmployment:
