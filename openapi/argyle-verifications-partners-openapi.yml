  /partners/v2/verifications/refresh:
    post:
      summary: Refresh a verification
      description: >-
        Creates a new payroll, banking, or Doc VOI verification without
        requiring the user to reconnect or upload additional documents.


        For payroll and banking, a valid connection must already exist. For Doc
        VOI, the new report is generated from the user's existing uploaded
        documents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerVerificationRefreshRequest'
            examples:
              payroll:
                summary: Example Request (Payroll)
                value:
                  user: 018051aa-f7a9-a0db-2f38-6cfa325e9d69
                  report:
                    type: voie
                  loan: *ref_0
                  billing: *ref_1
              banking:
                summary: Example Request (Banking)
                value:
                  user: 018051aa-f7a9-a0db-2f38-6cfa325e9d69
                  report:
                    type: voa
                    configuration:
                      from_date: '2025-01-01T00:00:00Z'
                  loan: *ref_0
                  billing: *ref_1
              documents:
                summary: Example Request (Documents)
                value:
                  user: 018051aa-f7a9-a0db-2f38-6cfa325e9d69
                  report:
                    type: doc-voi-mortgage
                  loan: *ref_0
                  billing: *ref_1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerVerification'
              examples:
