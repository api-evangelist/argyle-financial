naftiko: 1.0.0-alpha2
info:
  label: Argyle Gig Worker Coverage
  description: >-
    Gig-economy data surface for a connected Argyle user — gigs, shifts,
    vehicles, and platform ratings. Powers underwriting of 1099 income,
    background checks for gig marketplaces, and worker-quality scoring
    against rideshare and delivery platforms.
  tags:
    - Argyle
    - Gig Economy
    - 1099
    - Shifts
    - Vehicles
    - Ratings
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
  - namespace: env
    keys:
      ARGYLE_API_KEY_ID: ARGYLE_API_KEY_ID
      ARGYLE_API_KEY_SECRET: ARGYLE_API_KEY_SECRET
capability:
  consumes:
    - type: http
      namespace: argyle-gig
      baseUri: https://api.argyle.com/v2
      auth:
        type: basic
        username: env.ARGYLE_API_KEY_ID
        password: env.ARGYLE_API_KEY_SECRET
      resources:
        - name: gigs
          path: /gigs
          operations:
            - name: listGigs
              method: GET
              description: List all gigs for a connected gig-worker user.
              outputRawFormat: json
              inputParameters:
                - name: user
                  in: query
                  type: string
                  required: true
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: shifts
          path: /shifts
          operations:
            - name: listShifts
              method: GET
              description: List shifts for a user.
              outputRawFormat: json
              inputParameters:
                - name: user
                  in: query
                  type: string
                  required: true
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: vehicles
          path: /vehicles
          operations:
            - name: listVehicles
              method: GET
              description: List vehicles registered with the user's gig platforms.
              outputRawFormat: json
              inputParameters:
                - name: user
                  in: query
                  type: string
                  required: true
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: ratings
          path: /ratings
          operations:
            - name: listRatings
              method: GET
              description: List performance ratings for the user across gig platforms.
              outputRawFormat: json
              inputParameters:
                - name: user
                  in: query
                  type: string
                  required: true
              outputParameters:
                - name: result
                  type: object
                  value: $.
  exposes:
    - type: mcp
      namespace: argyle-gig-mcp
      port: 9092
      transport: http
      description: MCP adapter exposing Argyle gig-worker data sets as tools.
      tools:
        - name: argyle-list-gigs
          description: List a user's gigs across rideshare and delivery platforms.
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: argyle-gig.listGigs
          with:
            user: tools.user
          outputParameters:
            - type: object
              mapping: $.
        - name: argyle-list-shifts
          description: List a user's hourly shifts.
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: argyle-gig.listShifts
          with:
            user: tools.user
          outputParameters:
            - type: object
              mapping: $.
        - name: argyle-list-vehicles
          description: List a user's vehicles on file with gig platforms.
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: argyle-gig.listVehicles
          with:
            user: tools.user
          outputParameters:
            - type: object
              mapping: $.
        - name: argyle-list-ratings
          description: List a user's gig-platform performance ratings.
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: argyle-gig.listRatings
          with:
            user: tools.user
          outputParameters:
            - type: object
              mapping: $.
