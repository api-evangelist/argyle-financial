aid: argyle-financial
name: Argyle
description: Argyle is a consumer-permissioned employment and income data platform.
  The REST API and Link SDK let lenders, mortgage originators, background-check firms,
  gig marketplaces, and government benefits programs verify a worker's identity, employment,
  income, paystubs, deposits, shifts, gigs, and ratings directly from the source payroll,
  gig, and banking systems. Verification workflows ship as a single API surface that
  can be embedded through hosted Link, web/iOS/Android/React Native/Flutter SDKs,
  or driven entirely server side. Argyle covers approximately 90% of the U.S. workforce
  and is used by partners including Checkr, NFM Lending, Regional Finance, and LMCU,
  with loan-origination integrations into Encompass, nCino, Empower, and Byte.
