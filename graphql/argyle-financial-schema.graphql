# ─── Core Identity & User Types ─────────────────────────────────────────────

type ArgyleUser {
  id: UUID!
  externalId: String
  createdAt: DateTime!
  updatedAt: DateTime!
  accounts: [Account!]!
  identity: Identity
  employments: [Employment!]!
  paystubs(limit: Int, offset: Int): PaystubConnection!
  verifications: [Verification!]!
  uploads: [UserUpload!]!
  forms: [UserForm!]!
  invites: [Invite!]!
  reports: [Report!]!
  bankAccounts: [BankAccount!]!
  depositDestinations: [DepositDestination!]!
}

type UserToken {
  token: String!
  userId: UUID!
  expiresAt: DateTime!
}

type Identity {
  id: UUID!
  userId: UUID!
  accountId: UUID!
  firstName: String
  lastName: String
  fullName: String
  email: String
  phone: String
  dateOfBirth: Date
  ssn: String
  ssnLastFour: String
  address: Address
  employmentType: EmploymentType
  hireDate: Date
  terminationDate: Date
  employerName: String
  jobTitle: String
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Address {
  line1: String
  line2: String
  city: String
  state: String
  postalCode: String
  country: String
  fullAddress: String
}

