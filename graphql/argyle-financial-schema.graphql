# Argyle Financial — Conceptual GraphQL Schema
# Covers employment verification, income data, gig economy, banking,
# documents, and platform administration domains.

# ─── Scalars ────────────────────────────────────────────────────────────────

scalar DateTime
scalar Date
scalar JSON
scalar URL
scalar UUID
scalar Decimal

# ─── Enums ──────────────────────────────────────────────────────────────────

