# ─── Query Root ──────────────────────────────────────────────────────────────

type Query {
  # Users
  user(id: UUID!): ArgyleUser
  users(limit: Int, offset: Int, externalId: String): [ArgyleUser!]!

  # Accounts
  account(id: UUID!): Account
  accounts(userId: UUID, status: AccountStatus, limit: Int, offset: Int): [Account!]!

  # Items (supported employers/platforms)
  item(id: String!): Item
  items(search: String, categories: [String!], limit: Int, offset: Int): [Item!]!
  itemFilters: [ItemFilter!]!

  # Identities
  identity(id: UUID!): Identity
  identities(userId: UUID, accountId: UUID): [Identity!]!

  # Employments
  employment(id: UUID!): Employment
  employments(userId: UUID, accountId: UUID, status: EmploymentStatus, limit: Int, offset: Int): [Employment!]!

  # Paystubs
  paystub(id: UUID!): Paystub
  paystubs(userId: UUID, accountId: UUID, employmentId: UUID, fromDate: Date, toDate: Date, limit: Int, offset: Int): PaystubConnection!

  # Payroll Documents
  payrollDocument(id: UUID!): PayrollDocument
  payrollDocuments(userId: UUID, accountId: UUID, type: DocumentType, status: DocumentStatus, taxYear: Int, limit: Int, offset: Int): [PayrollDocument!]!

  # Shifts
  shift(id: UUID!): Shift
  shifts(userId: UUID, accountId: UUID, fromDate: Date, toDate: Date, limit: Int, offset: Int): ShiftConnection!

  # Gigs
  gig(id: UUID!): Gig
  gigs(userId: UUID, accountId: UUID, type: GigType, platform: String, fromDate: Date, toDate: Date, limit: Int, offset: Int): GigConnection!

  # Vehicles
  vehicle(id: UUID!): Vehicle
  vehicles(userId: UUID, accountId: UUID): [Vehicle!]!

  # Ratings
  rating(id: UUID!): Rating
  ratings(userId: UUID, accountId: UUID, platform: String): [Rating!]!

  # Banking
  bankAccount(id: UUID!): BankAccount
  bankAccounts(userId: UUID, accountType: BankAccountType, limit: Int, offset: Int): [BankAccount!]!
  financialInstitution(id: String!): FinancialInstitution
  financialInstitutions(search: String, limit: Int, offset: Int): [FinancialInstitution!]!
  transactions(bankAccountId: UUID!, fromDate: Date, toDate: Date, limit: Int, offset: Int): TransactionConnection!

  # Deposit Destinations
  depositDestination(id: UUID!): DepositDestination
  depositDestinations(userId: UUID, accountId: UUID): [DepositDestination!]!

  # Verifications
  verification(id: UUID!): Verification
  verifications(userId: UUID, type: VerificationType, status: VerificationStatus, limit: Int, offset: Int): [Verification!]!

  # Reports
  report(id: UUID!): Report
  reports(userId: UUID, status: ReportStatus, format: ReportFormat, limit: Int, offset: Int): [Report!]!

  # Invites
  invite(id: UUID!): Invite
  invites(userId: UUID, status: InviteStatus, limit: Int, offset: Int): [Invite!]!

  # Uploads
  userUpload(id: UUID!): UserUpload
  userUploads(userId: UUID, documentType: DocumentType, status: UploadStatus, limit: Int, offset: Int): [UserUpload!]!

  # Forms
  userForm(id: UUID!): UserForm
  userForms(userId: UUID, formType: String, status: FormResponseStatus, limit: Int, offset: Int): [UserForm!]!

  # Receipts
  receipt(id: UUID!): Receipt
  receipts(userId: UUID, verificationId: UUID, fromDate: Date, toDate: Date, limit: Int, offset: Int): [Receipt!]!
}

# ─── Mutation Root ───────────────────────────────────────────────────────────

type Mutation {
  # User management
  createUser(input: CreateUserInput!): ArgyleUser!
  updateUser(id: UUID!, input: UpdateUserInput!): ArgyleUser!
  deleteUser(id: UUID!): Boolean!
  createUserToken(userId: UUID!): UserToken!

  # Account management
  disableAccountUpdates(id: UUID!): Account!
  deleteAccount(id: UUID!): Boolean!

  # Item filters
  createItemFilter(input: CreateItemFilterInput!): ItemFilter!
  updateItemFilter(id: UUID!, input: UpdateItemFilterInput!): ItemFilter!
  deleteItemFilter(id: UUID!): Boolean!

  # Invites
  createInvite(input: CreateInviteInput!): Invite!
  resendInvite(id: UUID!): Invite!
  revokeInvite(id: UUID!): Invite!

  # Verifications
  orderVerification(input: OrderVerificationInput!): Verification!
  cancelVerification(id: UUID!): Verification!
  refreshVerification(id: UUID!): Verification!

  # Reports
  generateReport(input: GenerateReportInput!): Report!

  # Uploads
  initiateUpload(input: InitiateUploadInput!): UserUpload!
  deleteUpload(id: UUID!): Boolean!

  # Deposit destinations
  updateDepositDestination(id: UUID!, input: UpdateDepositDestinationInput!): DepositDestination!
}

# ─── Input Types ─────────────────────────────────────────────────────────────

input CreateUserInput {
  externalId: String
