}

input UpdateItemFilterInput {
  name: String
  includedItems: [String!]
  excludedItems: [String!]
  categories: [String!]
}

input CreateInviteInput {
  recipientEmail: String
  recipientPhone: String
  channel: InviteChannel!
  expiresAt: DateTime
  metadata: JSON
}

input OrderVerificationInput {
  userId: UUID!
  type: VerificationType!
  accountId: UUID
  metadata: JSON
}

input GenerateReportInput {
  userId: UUID!
  verificationId: UUID
  format: ReportFormat!
  types: [VerificationType!]!
}

input InitiateUploadInput {
  userId: UUID!
  filename: String!
  mimeType: String!
  documentType: DocumentType
}

input UpdateDepositDestinationInput {
  allocationAmount: Decimal
  allocationPercent: Decimal
  isFullDeposit: Boolean
}
